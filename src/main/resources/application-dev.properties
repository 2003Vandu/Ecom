spring.application.name=eComm

spring.datasource.url=${DATABASE_URL}

spring.datasource.username=${DATABASE_ADMIN_USERNAME}

spring.datasource.password=${DATABASE_PASSWORD}

## JPA PROPERTI Help us to generate table

spring.jpa.hibernate.ddl-auto=update 

server.servlet.context-path=/api/v1.0

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

aws.access.key=${AWS_ACCESS_KEY}

aws.secret.key=${AWS_SECRET_KEY}

aws.region= ap-southeast-2

aws.bucket.name=billing-software-vandeshaws
jwt.secret.key= ${JWT_SECRET_KEY}


razorpay.key-id=${RAZORPAY_KEY_ID}

razorpay.key.secret=${RAZORPAY_SECREAT_KEY}

# shows you in logs when transactions start/commit/rollback
logging.level.org.springframework.transaction=DEBUG

# shows actual SQL being executed
logging.level.org.hibernate.SQL=DEBUG